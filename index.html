<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Multimodal - Escola de Música</title>
  <link rel="stylesheet" href="src/css/estilo.css">
</head>
<body>
<header>
    <h1>Escola de Música</h1>
    <p>Painel Multimodal de Instrumentos</p>
  </header>
  <main>
    <section class="busca">
      <input type="text" id="busca" placeholder="Buscar instrumento...">
      <button id="btn-buscar">Buscar</button>
      <p id="mensagem"></p>
    </section>
    <section id="grid" class="grid"></section>
    <section class="telemetria">
      <h2>Telemetria</h2>
      <p id="telemetria"></p>
    </section>
  </main>
</body>
</html>
